<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Convite para a Festa</title>
</head>
<body>

<center
  <h1>Você foi convidado para a festa!</h1>
  <h3>Preencha o formulário</h3>

  <form action="#" method="post">
    
    <label for="campo-nome">Nome completo:</label><br>
    <input type="text" id="campo-nome" name="nome"><br><br>

    <label>Qual o seu curso?</label><br>
    <input type="radio" id="curso-eng" name="curso" value="engenharia">
    <label for="curso-eng">Engenharia</label><br>
    
    <input type="radio" id="curso-dir" name="curso" value="direito">
    <label for="curso-dir">Direito</label><br>
    
    <input type="radio" id="curso-outro" name="curso" value="outro">
    <label for="curso-outro">Outro curso:</label><br>
    <input type="text" id="campo-outro-curso" name="outro_curso"><br><br>

    <label for="campo-vinculo">Vínculo com a instituição:</label><br>
    <select id="campo-vinculo" name="vinculo">
      <option value="ufrb">Aluno da UFRB</option>
      <option value="externo">Convidado de fora</option>
    </select><br><br>
    

    <label for="campo-mensagem">Deixe um recado ou expectativa para a festa:</label><br>
    <textarea id="campo-mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem"></textarea><br><br>

     <h2>Entre em contato</h2>
    <label for="campo-telefone">Telefone para contato:</label><br>
    <input type="tel" id="campo-telefone" name="telefone"><br><br>

    <label for="campo-email">E-mail de contato:</label><br>
    <input type="email" id="campo-email" name="email"><br><br>

    <input type="checkbox" id="campo-maioridade" name="maioridade" value="sim">
    <label for="campo-maioridade">Confirmo que sou maior de idade (Obrigatório)</label><br><br>

<label for="campo-mensagem">Meu contato:</label><br>
    <textarea id="campo-mensagem" name="mensagem" rows="5" placeholder="Me mande uma mensagem!!"></textarea><br><br>

    <button type="submit">Enviar</button>

  </form>
 </center>
</body>
</html>
